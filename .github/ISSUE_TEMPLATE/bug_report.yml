name: Bug Report
description: Report a reproducible problem in bankstatementparser-writer-ofx
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: input
    id: version
    attributes:
      label: bankstatementparser-writer-ofx Version
      placeholder: "0.0.10"
    validations:
      required: true
  - type: input
    id: bankstatementparser_version
    attributes:
      label: bankstatementparser Version
      placeholder: "0.0.10"
    validations:
      required: true
  - type: dropdown
    id: python_version
    attributes:
      label: Python Version
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
    validations:
      required: true
  - type: dropdown
    id: entry_point
    attributes:
      label: Function
      options:
        - to_ofx
        - write_ofx
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: |
        The smallest Python snippet and input that show the problem (redact
        any sensitive account numbers or balances - placeholder data is fine).
      render: python
    validations:
      required: true
  - type: textarea
    id: error_output
    attributes:
      label: Output Or Error
      description: What you got (output or traceback) and what you expected.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything Else
      description: Logs, environment details, etc.
