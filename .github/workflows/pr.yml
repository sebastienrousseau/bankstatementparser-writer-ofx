name: PR Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: PR sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install this package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov interrogate hypothesis ruff mypy 'tomli; python_version<"3.11"'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy bankstatementparser_writer_ofx tests

      - name: Tests with 100% coverage gate
        run: |
          # --cov, --cov-branch and the 100% floor come from
          # pyproject.toml, so a local `pytest` enforces exactly this.
          pytest tests/ --cov-report=xml

      - name: Docstring coverage
        run: interrogate -c pyproject.toml bankstatementparser_writer_ofx

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
