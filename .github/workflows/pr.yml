name: PR Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: PR sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked dependencies + this package
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy bankstatementparser_writer_ofx tests

      - name: Tests with 100% coverage gate
        run: |
          # --cov, --cov-branch and the 100% floor come from
          # pyproject.toml, so a local `pytest` enforces exactly this.
          pytest tests/ --cov-report=xml

      - name: Docstring coverage
        run: interrogate -c pyproject.toml bankstatementparser_writer_ofx

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
