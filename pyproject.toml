[tool.poetry]
name = "bankstatementparser-writer-ofx"
version = "0.0.36"
description = "Open Financial Exchange (OFX) structured export writer for bankstatementparser."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/bankstatementparser-writer-ofx"
homepage = "https://bankstatementparser.com"
keywords = ["ofx", "open-financial-exchange", "bank", "export", "writer", "transactions"]
packages = [
    { include = "bankstatementparser_writer_ofx" },
]

[tool.poetry.plugins."bankstatementparser.writers"]
ofx = "bankstatementparser_writer_ofx.writer:write_ofx"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
bankstatementparser = ">=0.0.35"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<10.0.0"
pytest-cov = "^7.1.0"
pytest-benchmark = "^5.1.0"
ruff = ">=0.15.7,<0.18"
mypy = ">=1.5,<3"
bandit = "^1.7.0"
hypothesis = ">=6.82,<7"
interrogate = "^1.7.0"
# tests/test_writer.py and tests/test_suite_conformance.py read
# pyproject.toml with tomllib, which is stdlib only from 3.11; CI
# tests 3.10 too.
tomli = { version = ">=2", python = "<3.11" }
packaging = ">=23"
build = "^1.6.1"
# pip-audit pulls filelock (via cachecontrol[filecache]). Every filelock
# up to 4.2.0 carries advisories and 4.2.1 needs Python 3.11, so pip-audit
# is installed on 3.11+ only (its CI job runs on 3.12) and the floor keeps
# any affected filelock from resolving.
pip-audit = { version = "^2.10.1", python = ">=3.11" }
filelock = { version = ">=4.2.1", python = ">=3.11" }

# The user manual (mkdocs.yml, deployed to GitHub Pages by
# .github/workflows/docs.yml). CI installs requirements/docs.txt, the
# hashed export of this group. mkdocs-material 9.8 needs Python 3.11, and
# the manual is built on 3.12 only, so the group is marked to match.
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs-material = { version = "^9.8", python = ">=3.11" }
mkdocstrings = { version = ">=1.0", python = ">=3.11", extras = ["python"] }

# Coverage-guided fuzzing of the OFX writer
# (fuzz/fuzz_to_ofx.py, run by the CI "Fuzz" job). Atheris ships
# wheels for Linux x86_64 on CPython 3.12+ only and no sdist, so the group
# is optional and marked to match.
[tool.poetry.group.fuzz]
optional = true

[tool.poetry.group.fuzz.dependencies]
atheris = { version = "^3.1.0", python = ">=3.12", markers = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
target-version = "py310"
# The vendored conformance test carries a sha256 of its own bytes.
# It is maintained centrally in bankstatementparser and linted there;
# letting ruff reformat it here, at this repository's line length,
# would invalidate the very check it exists to make.
extend-exclude = [
    "*.md",
    "tmp_env",
    ".venv",
    ".eggs",
    "tests/test_suite_conformance.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "bankstatementparser.*",
    "pandas.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
fail-under = 100
exclude = ["setup.py", "docs", "build", "tests", ".venv"]
verbose = 2
quiet = false
color = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bankstatementparser_writer_ofx --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100"
